[project]
name = "discovery-agent"
version = "0.1.0"
description = "Temporal-first durable AI agent (MVP)"
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
	"temporalio>=1.7.0",
	"fastapi>=0.112",
	"uvicorn>=0.30",
	"pydantic>=2.8",
	"pydantic-settings>=2.2",
	"orjson>=3.10",
	"typing-extensions>=4.12",
	"httpx>=0.27",
	"tenacity>=9.0",
	"anyio>=4.4",
	# LLM providers
	"openai>=1.43.0",
	"anthropic>=0.34.0",
	# OpenAI Agents SDK (Temporal integration)
	"openai-agents>=0.5.0",
	# Observability
	"opentelemetry-sdk>=1.26",
	"opentelemetry-exporter-otlp>=1.26",
	"opentelemetry-instrumentation-httpx>=0.46b0",
]

[tool.uv]
index-strategy = "unsafe-best-match"
