[project]
name = "discovery-agent"
version = "0.1.0"
description = "Temporal-first durable AI agent (MVP)"
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
	# Core
	"temporalio>=1.16.0",
	"fastapi>=0.116.1",
	"uvicorn>=0.35.0",
	"pydantic>=2.11.0",
	"pydantic-settings>=2.10.0",
	"orjson>=3.11.3",
	"typing-extensions>=4.15.0",
	"httpx>=0.28.1",
	"tenacity>=9.1.0",
	"anyio>=4.10.0",
	# MCP (Model Context Protocol)
	"mcp>=1.0.0",
	# LLM providers
	"openai>=1.102.0",
	"anthropic>=0.64.0",
	# OpenAI Agents SDK (Temporal integration)
	"openai-agents>=0.2.10,<0.3.0",
	# Observability (versions aligned with 0.57b0 instrumentation)
	"opentelemetry-api==1.36.0",
	"opentelemetry-sdk==1.36.0",
	"opentelemetry-exporter-otlp==1.36.0",
	"opentelemetry-instrumentation-httpx==0.57b0",
]

[tool.uv]
index-strategy = "unsafe-best-match"
